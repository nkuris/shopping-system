version: "3.8"
services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      SA_PASSWORD: "BlueMonday2@"
      ACCEPT_EULA: "Y"
      MSSQL_PID: "Express"
    ports:
      - "1433:1433"
    volumes:
      - sqlserver-data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "for i in $(seq 1 30); do (echo > /dev/tcp/localhost/1433) >/dev/null 2>&1 && exit 0 || sleep 1; done; exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  sqlserver-setup:
    image: mcr.microsoft.com/mssql-tools:latest
    depends_on:
      sqlserver:
        condition: service_healthy
    environment:
      - SA_PASSWORD=BlueMonday2@
    volumes:
      - ./mssql/init:/scripts:ro
    entrypoint: ["/bin/bash","-c"]
    command: |
      for i in $(seq 1 30); do
        /opt/mssql-tools/bin/sqlcmd -S sqlserver -U sa -P "$SA_PASSWORD" -i /scripts/init.sql && exit 0 || sleep 1
      done
      echo "Failed to run init script after multiple attempts"; exit 1

  mongo:
    image: mongo:6.0
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand({ping:1})"]
      interval: 10s
      timeout: 5s
      retries: 5

  catalogservice:
    build:
      context: ./CatalogService
      dockerfile: Dockerfile
    environment:
      - ConnectionStrings__DefaultConnection=Server=sqlserver,1433;Database=CatalogDb;User Id=sa;Password=BlueMonday2@;TrustServerCertificate=True;Encrypt=False;
      - DB_MIGRATION_RETRIES=30
      - DB_MIGRATION_DELAY_SECONDS=2
    depends_on:
      sqlserver:
        condition: service_healthy
      sqlserver-setup:
        condition: service_completed_successfully
    ports:
      - "5000:80"

  orderservice:
    build:
      context: ./OrderService
      dockerfile: Dockerfile
    environment:
      - MONGO_URI=mongodb://mongo:27017/shopping_orders_db
      - PORT=5001
    depends_on:
      mongo:
        condition: service_healthy
    ports:
      - "5001:5001"

  client:
    build:
      context: ./client
      dockerfile: Dockerfile
    environment:
      - REACT_APP_CATALOG_URL=http://catalogservice:80
      - REACT_APP_ORDER_URL=http://orderservice:5001
    ports:
      - "3000:80"
    depends_on:
      - catalogservice
      - orderservice

volumes:
  sqlserver-data:
  mongo-data:
