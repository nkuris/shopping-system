services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      SA_PASSWORD: "BlueMonday2@"
      ACCEPT_EULA: "Y"
      MSSQL_PID: "Express"
    ports:
      - "1433:1433"
    volumes:
      - sqlserver-data:/var/opt/mssql
    # Healthcheck removed: the container's internal shell lacks a reliable /dev/tcp or required tools
    # on some hosts which caused false 'unhealthy' state. The application includes a robust
    # migration-retry loop so it will wait for the DB to be reachable. Remove this block if you
    # want to reintroduce a more reliable healthcheck later.

  # sqlserver-setup removed: DB creation/initialization is handled by the application migrations
  # or by running the init script manually. This avoids an extra one-shot container that
  # can introduce startup ordering and shell quoting issues on some hosts.

  mongo:
    image: mongo:6.0
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand({ping:1})"]
      interval: 10s
      timeout: 5s
      retries: 5

  catalogservice:
    build:
      context: ./CatalogService
      dockerfile: Dockerfile
    environment:
      - ConnectionStrings__DefaultConnection=Server=sqlserver,1433;Database=CatalogDb;User Id=sa;Password=BlueMonday2@;TrustServerCertificate=True;Encrypt=False;
      - DB_MIGRATION_RETRIES=30
      - DB_MIGRATION_DELAY_SECONDS=2
    depends_on:
      - sqlserver
    ports:
      - "5000:80"

  orderservice:
    build:
      context: ./OrderService
      dockerfile: Dockerfile
    environment:
      - MONGO_URI=mongodb://mongo:27017/shopping_orders_db
      - PORT=5001
    depends_on:
      mongo:
        condition: service_healthy
    ports:
      - "5001:5001"

  client:
    build:
      context: ./client
      dockerfile: Dockerfile
    environment:
      - REACT_APP_CATALOG_URL=http://catalogservice:80
      - REACT_APP_ORDER_URL=http://orderservice:5001
    ports:
      - "3000:80"
    depends_on:
      - catalogservice
      - orderservice

volumes:
  sqlserver-data:
  mongo-data:
